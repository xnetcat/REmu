[workspace]
members = [
    "crates/remu-cli",
    "crates/remu-core",
    "crates/remu-gpu",
    "crates/remu-gpu-metal",
    "crates/remu-loader",
    "crates/remu-memory",
    "crates/remu-platform",
    "crates/remu-runtime",
    "crates/remu-shader",
    "crates/remu-shader-metal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-2.0-or-later"

[workspace.dependencies]
block = "0.1"
cc = "1.2"
clap = { version = "4.5", features = ["derive"] }
core-graphics-types = "0.2"
cpal = "0.18"
iced-x86 = "1.21"
libc = "0.2"
metal = { version = "0.33", features = ["private"] }
objc = "0.2"
png = "0.17.16"
sha1 = "0.10"
smallvec = "1.15"
symphonia = { version = "0.5.4", default-features = false, features = ["aac"] }
thiserror = "2.0"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
# Module boundaries must not cost performance. Without this, rustc partitions the crate
# into 16 codegen units along module lines and will not inline across them, so splitting
# a large file into topic modules can silently pessimise hot paths such as import
# dispatch. ThinLTO restores cross-module inlining at a modest build-time cost.
lto = "thin"
