[workspace]
members = [
    "crates/remu-cli",
    "crates/remu-core",
    "crates/remu-gpu",
    "crates/remu-gpu-metal",
    "crates/remu-loader",
    "crates/remu-memory",
    "crates/remu-platform",
    "crates/remu-runtime",
    "crates/remu-shader",
    "crates/remu-shader-metal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-2.0-or-later"

[workspace.dependencies]
block = "0.1"
cc = "1.2"
clap = { version = "4.5", features = ["derive"] }
core-graphics-types = "0.2"
cpal = "0.18"
iced-x86 = "1.21"
half = "2.7"
libc = "0.2"
metal = { version = "0.33", features = ["private"] }
objc = "0.2"
png = "0.17.16"
sha1 = "0.10"
smallvec = "1.15"
rustfft = "6.4"
symphonia = { version = "0.5.4", default-features = false, features = ["aac"] }
thiserror = "2.0"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
# H3: rustc unused/dead_code debt cleared; CI clippy uses `-D warnings` against this set.
# Pedantic stays allow — ~1.8k style/doc/cast nits are a separate sweep, not H3's ≈38 target.
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
# Structural / ABI surfaces that clippy::all flags but rewriting would obscure intent:
unusual_byte_groupings = "allow" # PM4 / RDNA / SHA-NI opcode literals
type_complexity = "allow" # Metal/guest callback and evaluator tuples
too_many_arguments = "allow" # Guest ABI and encoder entry points
large_enum_variant = "allow" # GpuEvent / decode payloads
enum_variant_names = "allow" # SDK-shaped names
wildcard_in_or_patterns = "allow" # Exhaustive guest opcode matches
if_same_then_else = "allow" # Intentional symmetric branches (often title-parity)
assertions_on_constants = "allow" # Static ABI size checks

[profile.release]
# Module boundaries must not cost performance. Without this, rustc partitions the crate
# into independent codegen units along module lines and will not inline across them, so splitting
# a large file into topic modules can silently pessimise hot paths such as import dispatch.
# ThinLTO plus one release unit gives rustc a complete optimization view of the CPU/GPU front end;
# release builds take longer, but emulator runtime throughput is the priority.
lto = "thin"
codegen-units = 1
