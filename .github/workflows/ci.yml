# The gate CONTRIBUTING.md documents, as CI (plan H1). REmu is a macOS/Metal emulator whose
# x86_64 target runs guest code under Rosetta 2, so both the native arm64 and the cross-built
# x86_64 configurations are checked on Apple-Silicon runners. Tests run serially
# (`--test-threads=1`): the runtime suite's residual global-counter cross-talk (docs/status.md)
# is not yet fully removed, so serial remains the honest gate. Clippy denies warnings (plan H3).
#
# Plan E3 / H1 Tier B (remu replay --check over frame goldens) is intentionally absent: the
# scripts-side harness is a loud stub (scripts/remu-replay.py exits 78) until remu-cli grows
# Command::Replay and an out-of-repo corpus exists. The python job below asserts that stub.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      # Preserve the Objective-C exception name/reason if a native Metal validation rejects an
      # argument-buffer operation before Rust can report it.
      OBJC_PRINT_EXCEPTIONS: YES
      NSUnbufferedIO: YES
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustup target add x86_64-apple-darwin
          rustc --version

      - name: Ensure Rosetta 2 is available for the x86_64 target
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install the offline Metal toolchain
        # Three remu-shader-metal tests compile generated MSL with Apple's `metal` tool.
        run: xcodebuild -downloadComponent MetalToolchain || true

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Tests (native arm64, serial)
        run: cargo test --workspace -- --test-threads=1

      - name: Tests (x86_64 under Rosetta, serial)
        run: cargo test --workspace --target x86_64-apple-darwin -- --test-threads=1

      - name: Clippy (deny warnings, plan H3)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings

      # Tier B (plan H1 / E3): enable when remu replay + out-of-repo goldens exist.
      # - name: Replay goldens (E3)
      #   run: scripts/remu-replay.sh --check "$REMU_REPLAY_CORPUS_DIR"

  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts/tests
      - name: E3 remu-replay stub stays loud (exit 78)
        run: |
          set +e
          scripts/remu-replay.sh /tmp/remu-e3-stub-corpus --check
          status=$?
          set -e
          test "$status" -eq 78
