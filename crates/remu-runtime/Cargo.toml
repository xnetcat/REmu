[package]
name = "remu-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
iced-x86.workspace = true
libc.workspace = true
remu-core = { path = "../remu-core" }
remu-gpu = { path = "../remu-gpu" }
remu-loader = { path = "../remu-loader" }
remu-memory = { path = "../remu-memory" }
remu-shader = { path = "../remu-shader" }
remu-shader-metal = { path = "../remu-shader-metal" }
png.workspace = true
sha1.workspace = true
symphonia.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal.workspace = true

[build-dependencies]
cc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints]
workspace = true
